<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Where Is My Room / PG</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:#2563eb;color:#fff;padding:18px 16px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px}header p{margin:5px 0 0;font-size:13px}
main{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000012}
h2{margin:0 0 12px;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;font-weight:700;margin:8px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;background:#fff}
textarea{min-height:75px;resize:vertical}.full{grid-column:1/-1}
button{border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:15px;cursor:pointer}
.primary{background:#16a34a;color:#fff}.blue{background:#2563eb;color:#fff}.dark{background:#172033;color:#fff}.gray{background:#e2e8f0;color:#172033}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.small{font-size:12px;color:#64748b}
#status{padding:10px;border-radius:10px;background:#eff6ff;color:#1e40af;margin:10px 0}
.listing{border:1px solid #dbe3ef;border-radius:12px;padding:13px;margin:10px 0}.listing h3{margin:0 0 7px}.meta{font-size:13px;line-height:1.6}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#e0ecff;color:#1d4ed8;font-size:12px;font-weight:700;margin:2px}
a.btn{display:inline-block;text-decoration:none;padding:9px 11px;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;font-size:13px}
.toprow{display:flex;justify-content:space-between;gap:8px;align-items:center}.count{font-weight:700}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><h1>Where Is My Room / PG</h1><p>Find Room & PG anywhere in India</p></header>
<main>
<div id="status">Connecting to database…</div>

<section class="card">
<h2>Search Room / PG</h2>
<div class="grid">
<div><label>State</label><select id="searchState"><option value="">All States</option></select></div>
<div><label>City / District</label><input id="searchCity" placeholder="City or District"></div>
<div><label>Area / Block</label><input id="searchArea" placeholder="Area or Block"></div>
<div><label>PIN Code</label><input id="searchPin" inputmode="numeric" maxlength="6" placeholder="6 digit PIN"></div>
</div>
<div class="actions"><button class="blue" id="searchBtn">Search</button><button class="gray" id="clearSearch">Clear</button></div>
</section>

<section class="card">
<div class="toprow"><h2>Available Rooms / PG</h2><span class="count" id="resultCount">0</span></div>
<div id="listings">Loading…</div>
</section>

<section class="card">
<h2>Owner Login</h2>
<p class="small">Owner access uses Mobile Number + 6-digit PIN. No email and no OTP.</p>
<div id="loginBox">
<div class="grid">
<div><label>Mobile Number</label><input id="loginMobile" inputmode="numeric" maxlength="10" placeholder="10 digit mobile"></div>
<div><label>6-digit PIN</label><input id="loginPin" type="password" inputmode="numeric" maxlength="6" placeholder="6 digit PIN"></div>
</div>
<div class="actions"><button class="blue" id="loginBtn">Owner Login</button><button class="gray" id="showRegister">Create Owner Account</button></div>
</div>

<div id="registerBox" class="hidden">
<div class="grid">
<div><label>Owner Name</label><input id="regName" placeholder="Owner name"></div>
<div><label>Mobile Number</label><input id="regMobile" inputmode="numeric" maxlength="10" placeholder="10 digit mobile"></div>
<div><label>6-digit PIN</label><input id="regPin" type="password" inputmode="numeric" maxlength="6" placeholder="6 digit PIN"></div>
<div><label>Confirm PIN</label><input id="regPin2" type="password" inputmode="numeric" maxlength="6" placeholder="Confirm PIN"></div>
</div>
<div class="actions"><button class="primary" id="registerBtn">Create Account</button><button class="gray" id="backLogin">Back</button></div>
</div>

<div id="ownerPanel" class="hidden">
<p><b id="ownerWelcome"></b></p>
<div class="actions"><button class="primary" id="addBtn">＋ Add Room / PG</button><button class="gray" id="logoutBtn">Logout</button></div>
</div>
</section>

<section id="addCard" class="card hidden">
<h2>Add Room / PG</h2>
<div class="grid">
<div><label>Listing Type</label><select id="type"><option>Room</option><option>PG</option></select></div>
<div><label>For</label><select id="forWho"><option>Anyone</option><option>Boys</option><option>Girls</option></select></div>
<div><label>Sharing</label><select id="sharing"><option>Single</option><option>Double</option><option>Triple</option></select></div>
<div><label>State</label><select id="state"></select></div>
<div><label>City / District</label><input id="city" placeholder="City or District"></div>
<div><label>Area / Block</label><input id="area" placeholder="Area or Block"></div>
<div><label>PIN Code</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="6 digit PIN"></div>
<div><label>Google Location Link</label><input id="map" type="url" placeholder="Paste Google Maps link"></div>
<div class="full"><label>Address / Details</label><textarea id="details" placeholder="Room/PG details"></textarea></div>
</div>
<div class="actions"><button class="primary" id="saveBtn">Save Room / PG</button><button class="gray" id="cancelAdd">Cancel</button></div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyD3nvPICve3_fo9ghXtNL99apumkkSaEh0",
 authDomain:"where-is-my-room-ya-pg.firebaseapp.com",
 projectId:"where-is-my-room-ya-pg",
 storageBucket:"where-is-my-room-ya-pg.firebasestorage.app",
 messagingSenderId:"941315065299",
 appId:"1:941315065299:web:ba0066f9b1c41a6b049b26",
 measurementId:"G-9NBM075XYK"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const states=["Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chhattisgarh","Goa","Gujarat","Haryana","Himachal Pradesh","Jharkhand","Karnataka","Kerala","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal","Andaman and Nicobar Islands","Chandigarh","Dadra and Nagar Haveli and Daman and Diu","Delhi","Jammu and Kashmir","Ladakh","Lakshadweep","Puducherry"];
const $=id=>document.getElementById(id);
function fillStates(sel){states.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;sel.appendChild(o)})}
fillStates($("searchState"));fillStates($("state"));
function cleanMobile(v){return(v||"").replace(/\D/g,"").slice(-10)}
function validPin(v){return/^\d{6}$/.test(v)}
async function sha256(text){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function setStatus(msg,err=false){$("status").textContent=msg;$("status").style.background=err?"#fef2f2":"#eff6ff";$("status").style.color=err?"#991b1b":"#1e40af"}
let allListings=[],owner=null;
async function loadListings(){
try{const snap=await db.collection("listings").orderBy("createdAt","desc").get();allListings=snap.docs.map(d=>({id:d.id,...d.data()}));renderListings();setStatus("Online database connected.")}
catch(e){setStatus("Database error: "+e.message,true);$("listings").innerHTML="<p>Listings could not be loaded. Check Firestore rules.</p>"}}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function safeUrl(v){try{const u=new URL(v);return/^https?:$/.test(u.protocol)?u.href:"#"}catch{return"#"}}
function renderListings(){
const st=$("searchState").value.toLowerCase(),city=$("searchCity").value.trim().toLowerCase(),area=$("searchArea").value.trim().toLowerCase(),pin=$("searchPin").value.trim();
const rows=allListings.filter(x=>(!st||(x.state||"").toLowerCase()===st)&&(!city||(x.city||"").toLowerCase().includes(city))&&(!area||(x.area||"").toLowerCase().includes(area))&&(!pin||(x.pin||"")===pin));
$("resultCount").textContent=rows.length;
$("listings").innerHTML=rows.length?rows.map(x=>`<div class="listing"><h3>${esc(x.type||"Room")} - ${esc(x.city||"")}</h3><span class="badge">${esc(x.forWho||"Anyone")}</span><span class="badge">${esc(x.sharing||"Single")}</span><div class="meta"><b>State:</b> ${esc(x.state||"")}<br><b>Area:</b> ${esc(x.area||"")} &nbsp; <b>PIN:</b> ${esc(x.pin||"")}<br><b>Owner:</b> ${esc(x.ownerName||"")}<br><b>Mobile:</b> ${esc(x.ownerMobile||"")}${x.details?`<br><b>Details:</b> ${esc(x.details)}`:""}</div><div class="actions">${x.ownerMobile?`<a class="btn" href="tel:${x.ownerMobile}">Call</a><a class="btn" href="https://wa.me/91${x.ownerMobile}" target="_blank">WhatsApp</a>`:""}${x.map?`<a class="btn" href="${safeUrl(x.map)}" target="_blank">Google Map</a>`:""}</div></div>`).join(""):"<p>No Room/PG found.</p>"}
$("searchBtn").onclick=renderListings;
$("clearSearch").onclick=()=>{$("searchState").value="";$("searchCity").value="";$("searchArea").value="";$("searchPin").value="";renderListings()};
$("showRegister").onclick=()=>{$("loginBox").classList.add("hidden");$("registerBox").classList.remove("hidden")};
$("backLogin").onclick=()=>{$("registerBox").classList.add("hidden");$("loginBox").classList.remove("hidden")};
$("registerBtn").onclick=async()=>{
const name=$("regName").value.trim(),mobile=cleanMobile($("regMobile").value),pin=$("regPin").value,pin2=$("regPin2").value;
if(!name||mobile.length!==10||!validPin(pin)||pin!==pin2)return alert("Enter owner name, valid 10-digit mobile and matching 6-digit PIN.");
try{const ref=db.collection("owners").doc(mobile),old=await ref.get();if(old.exists)return alert("This mobile number is already registered.");const pinHash=await sha256(pin);await ref.set({ownerName:name,mobile,pinHash,createdAt:firebase.firestore.FieldValue.serverTimestamp()});owner={ownerName:name,mobile};localStorage.setItem("wmr_owner",JSON.stringify(owner));showOwner();alert("Owner account created.")}catch(e){alert("Account creation failed: "+e.message)}};
$("loginBtn").onclick=async()=>{
const mobile=cleanMobile($("loginMobile").value),pin=$("loginPin").value;
if(mobile.length!==10||!validPin(pin))return alert("Enter 10-digit mobile and 6-digit PIN.");
try{const doc=await db.collection("owners").doc(mobile).get();if(!doc.exists)return alert("Owner account not found.");const h=await sha256(pin);if(doc.data().pinHash!==h)return alert("Wrong 6-digit PIN.");owner={ownerName:doc.data().ownerName,mobile};localStorage.setItem("wmr_owner",JSON.stringify(owner));showOwner()}catch(e){alert("Login failed: "+e.message)}};
function showOwner(){$("loginBox").classList.add("hidden");$("registerBox").classList.add("hidden");$("ownerPanel").classList.remove("hidden");$("ownerWelcome").textContent="Welcome, "+owner.ownerName+" ("+owner.mobile+")"}
$("logoutBtn").onclick=()=>{owner=null;localStorage.removeItem("wmr_owner");$("ownerPanel").classList.add("hidden");$("loginBox").classList.remove("hidden");$("addCard").classList.add("hidden")};
$("addBtn").onclick=()=>{$("addCard").classList.remove("hidden");window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})};
$("cancelAdd").onclick=()=>$("addCard").classList.add("hidden");
$("saveBtn").onclick=async()=>{
if(!owner)return alert("Owner login required.");
const data={type:$("type").value,forWho:$("forWho").value,sharing:$("sharing").value,state:$("state").value,city:$("city").value.trim(),area:$("area").value.trim(),pin:$("pin").value.trim(),map:$("map").value.trim(),details:$("details").value.trim(),ownerName:owner.ownerName,ownerMobile:owner.mobile,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
if(!data.state||!data.city||!data.area||!/^\d{6}$/.test(data.pin))return alert("State, City/District, Area/Block and valid 6-digit PIN are required.");
if(data.map){try{const u=new URL(data.map);if(!/^https?:$/.test(u.protocol))throw 0}catch{return alert("Please enter a valid Google Maps link.")}}
try{await db.collection("listings").add(data);alert("Room/PG saved successfully.");$("addCard").classList.add("hidden");["city","area","pin","map","details"].forEach(id=>$(id).value="");await loadListings()}catch(e){alert("Save failed: "+e.message)}};
try{owner=JSON.parse(localStorage.getItem("wmr_owner")||"null");if(owner)showOwner()}catch{}
loadListings();
</script>
</body>
</html>
